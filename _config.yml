# --- Build --------------------------------------------------------------
permalink: /blog/:title/
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge
  auto_ids: true

sass:
  style: compressed

defaults:
  - scope: { path: "", type: "posts" }
    values: { layout: post }

# Kept in the repo as upstream source or dead tooling, not published.
exclude:
  - package.json
  - package-lock.json
  - gulpfile.js
  - node_modules
  - src
  - latex
  - blogpost
  - doc
  - Gemfile
  - Gemfile.lock
  - README.md
  - .idea
  - .ruby-version
